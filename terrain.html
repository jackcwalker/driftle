<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Driftle · physical maps</title>
    <link rel="stylesheet" href="terrain.css?v=raster4" />
    <script src="vendor/d3.min.js"></script>
  </head>
  <body>
    <main>
      <canvas
        id="map"
        aria-label="Physical world map. Drag to pan, pinch to zoom."
        tabindex="0"
      ></canvas
      ><canvas id="water" aria-hidden="true"></canvas>
      <header>
        <a class="brand" href="./">driftle</a><span>Physical map study</span
        ><a class="sources" href="RASTER-MAPS.md">Sources</a>
      </header>
      <aside>
        <strong id="age">Today</strong
        ><small id="source">Loading terrain…</small>
      </aside>
      <div class="region">
        <button id="world">World</button><button id="europe">Europe</button>
      </div>
      <nav aria-label="Geological age">
        <button data-age="300">300 Ma</button
        ><button data-age="225">225 Ma</button
        ><button data-age="150">150 Ma</button
        ><button data-age="75">75 Ma</button
        ><button data-age="0" class="active">Today</button>
      </nav>
      <div class="zoom">
        <output id="zoom-level" aria-label="Map zoom">100%</output
        ><button id="zoom-in" aria-label="Zoom in">+</button
        ><button id="zoom-out" aria-label="Zoom out">−</button
        ><button id="reset" aria-label="Reset map view">↺</button>
      </div>
      <footer id="status" role="status">Loading physical map…</footer>
    </main>
    <script type="module" src="terrain.js?v=raster4"></script>
  </body>
</html>
